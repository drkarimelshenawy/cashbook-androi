name: Build Cash Book APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "downloads/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract source
        run: unzip -q CashBook-v0.13-source.zip -d source

      - name: Build APK
        working-directory: source/CashBook-Android-Test
        run: ./gradlew :cashbook-core:check :app:assembleDebug :app:lintDebug --no-daemon

      - name: Publish APK in repository
        run: |
          mkdir -p downloads
          cp source/CashBook-Android-Test/app/build/outputs/apk/debug/app-debug.apk downloads/CashBook-v0.13-test.apk
          sha256sum downloads/CashBook-v0.13-test.apk > downloads/CashBook-v0.13-test.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/
          git commit -m "Add Cash Book v0.13 test APK" || exit 0
          git push
